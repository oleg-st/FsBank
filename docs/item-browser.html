  $('results').innerHTML=slots.filter(slot=>visible.some(item=>item.item_slot===slot)).map(slot=>{
    const slotGroups=[...groups.values()].filter(group=>group.slot===slot).sort((a,b)=>Number(Boolean(b.setName))-Number(Boolean(a.setName))||collator.compare(a.setName,b.setName)||collator.compare(a.name,b.name));
    return `<section class="slot-section"><div class="slot-heading"><h2>${escapeHtml(slot)}</h2><span class="count-pill">${slotGroups.reduce((sum,group)=>sum+group.items.length,0)}</span></div>${slotGroups.map(group=>`<details class="group" data-group-id="${escapeHtml(group.id)}" ${state.closed.has(group.id)?'':'open'}><summary><span class="group-title" title="${escapeHtml(group.name+(group.setName?' (set: '+group.setName+')':''))}"><span class="group-name">${escapeHtml(group.name)}</span>${group.setName?` <span class="group-kind">(set: ${escapeHtml(group.setName)})</span>`:''}</span><span class="group-count">${group.items.length} ${group.items.length===1?'item':'items'}</span></summary><div class="table-wrap"><table aria-label="${escapeHtml(slot+' · '+group.name)}"><thead><tr>${headers}</tr></thead><tbody>${group.items.sort(compareItems).map(rowHtml).join('')}</tbody></table></div></details>`).join('')}</section>`;
  }).join('')||`<div class="empty"><h2>${items.length?'No items found':'Empty export'}</h2><p>${items.length?'Try a different search or reset the filters.':'Open an item JSON file to get started.'}</p></div>`;
  updateCollapseLabel();
}
function updateCollapseLabel(){const details=[...document.querySelectorAll('.group')];$('collapse').textContent=details.length&&details.every(group=>!group.open)?'Expand groups':'Collapse groups';$('collapse').disabled=!details.length;}
function resetFilters(){Object.assign(state,{slot:'all',query:'',group:'all',location:'all'});$('search').value='';$('group-filter').value='all';$('location-filter').value='all';render();}
$('search').addEventListener('input',event=>{state.query=event.target.value;render();});
$('group-filter').addEventListener('change',event=>{state.group=event.target.value;render();});
$('location-filter').addEventListener('change',event=>{state.location=event.target.value;render();});
$('slots').addEventListener('click',event=>{const button=event.target.closest('[data-slot]');if(button){state.slot=button.dataset.slot;render();window.scrollTo({top:0,behavior:'smooth'});}});
$('results').addEventListener('click',event=>{const button=event.target.closest('[data-sort]');if(button){const key=button.dataset.sort;state.direction=state.sort===key?-state.direction:key==='name'?1:-1;state.sort=key;render();}});
$('results').addEventListener('toggle',event=>{if(!event.target.matches('.group')||!event.target.isConnected)return;const group=event.target;group.open?state.closed.delete(group.dataset.groupId):state.closed.add(group.dataset.groupId);updateCollapseLabel();},true);
$('reset').addEventListener('click',resetFilters);
$('collapse').addEventListener('click',()=>{const details=[...document.querySelectorAll('.group')];const open=details.every(group=>!group.open);for(const group of details){group.open=open;open?state.closed.delete(group.dataset.groupId):state.closed.add(group.dataset.groupId);}updateCollapseLabel();});
$('import-button').addEventListener('click',()=>$('file-input').click());
$('file-input').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{const data=JSON.parse((await file.text()).replace(/^\uFEFF/,''));loadData(data);$('error').hidden=true;}catch(error){$('error').textContent='Could not open file: '+error.message;$('error').hidden=false;}finally{event.target.value='';}});
try{loadData(JSON.parse($('embedded-data').textContent));}catch(error){$('error').textContent=error.message;$('error').hidden=false;}
</script>
</body>
</html>
